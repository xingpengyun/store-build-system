<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>导出本地数据</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef2fb, #e9eefc 50%, #f3f0fd);
    color: #131c31;
  }
  .box {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(19, 28, 49, .12);
  }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { font-size: 12.5px; color: #63708c; margin: 0 0 20px; }
  .stat {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat div {
    background: #fafbfe;
    border: 1px solid #f0f4fa;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat b { display: block; font-size: 22px; font-weight: 700; line-height: 1.3; }
  .stat span { font-size: 11.5px; color: #9aa5bd; }
  button {
    width: 100%;
    height: 42px;
    border: 0;
    border-radius: 9px;
    background: linear-gradient(96deg, #3f6bf5, #5b81f7);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(63, 107, 245, .26);
  }
  button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .tip {
    margin-top: 16px;
    font-size: 12px;
    line-height: 1.8;
    color: #63708c;
    background: #f7f9fd;
    border-radius: 9px;
    padding: 12px 14px;
  }
  .tip b { color: #131c31; }
  .err { color: #f04438; }
</style>
</head>
<body>
  <div class="box">
    <h1>导出本地数据</h1>
    <p class="sub">把旧版本（本地版）存的门店数据导出成一个 JSON 文件</p>

    <div class="stat">
      <div><b id="nStore">—</b><span>门店</span></div>
      <div><b id="nTask">—</b><span>任务</span></div>
    </div>

    <button id="btn" disabled>下载 JSON 备份</button>

    <div class="tip">
      <b>下一步：</b><br>
      1. 下载这个文件<br>
      2. 打开 <b>https://store-build-system.app.workbuddy.link/?sharecode=ZVHDE3E4G6</b><br>
      3. 用手机号登录<br>
      4. 进「系统设置 → 从备份文件导入」，选中刚才的文件
    </div>
  </div>

<script>
(function () {
  var KEY = 'shopbuild.v1';
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}

  var data = null;
  if (raw) {
    try { data = JSON.parse(raw); } catch (e) {}
  }

  var btn = document.getElementById('btn');
  var nStore = document.getElementById('nStore');
  var nTask = document.getElementById('nTask');

  if (!data || !data.stores) {
    nStore.textContent = '0';
    nTask.textContent = '0';
    btn.textContent = '这个地址下没有找到本地数据';
    return;
  }

  nStore.textContent = data.stores.length;
  nTask.textContent = (data.tasks || []).length;
  btn.disabled = false;

  btn.addEventListener('click', function () {
    var text = JSON.stringify(data, null, 2);
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    a.href = url;
    a.download = '门店筹建数据_' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    btn.textContent = '已下载，去新网址导入吧';
  });
})();
</script>
</body>
</html>
