           之间那条空白带。viewBox 里松树从左边界框外延伸进来，右侧雪地一路下沉，
           底部用渐变化进侧边栏底色 —— 右、下都没有硬边，像雪景从面板外蔓延进来。
           深松绿剪影 + 浅蓝雪地 + 暖金窗光 + 一点红点缀，纯装饰不挡点击。 -->
      <svg class="xm-village" viewBox="0 0 196 150" preserveAspectRatio="none" fill="none" aria-hidden="true">

        </defs>
        <ellipse cx="96" cy="62" rx="94" ry="64" fill="url(#xvSky)"/>
        <!-- 远处雪松，越往右越淡 -->
        <g fill="#0c3030">
          <path d="M-6 34 -20 66h6l-9 15h25l-9-15h6zM18 50 7 73h5l-7 12h26l-7-12h5zM44 58 34 78h4l-6 10h24l-6-10h4z"/>
          <path d="M150 54 139 76h5l-7 12h26l-7-12h5zM176 62 166 80h4l-6 10h24l-6-10h4z"/>
        </g>
        <g fill="#eaf6ff" opacity=".75">
          <path d="M-6 34-12 47h12zM18 50 12 62h12zM44 58 39 68h10zM150 54 144 66h12zM176 62 171 72h10z"/>
        </g>
        <!-- 小屋：雪顶 + 暖窗 + 门前的树 -->
        <g>

          <path d="M62 84 94 62l32 22z" fill="#123b38"/>
          <path d="M62 84 94 62l32 22-4 3-28-20-28 20z" fill="#eaf6ff"/>

          <circle cx="109.5" cy="101.2" r=".7" fill="#e23b3f"/>
          <circle cx="112.5" cy="106" r="1" fill="#ffd489"/>
          <ellipse cx="90" cy="98" rx="22" ry="16" fill="url(#xvWin)" opacity=".5"/>
          <rect x="76" y="60" width="6" height="16" rx="1.2" fill="#0e3331"/>
          <rect x="75" y="59" width="8" height="2.4" rx="1" fill="#eaf6ff"/>

        <!-- 屋前那棵挂彩灯的圣诞树 -->

<!-- 圣诞全局装饰（z205）：固定定位 + pointer-events:none，不挡任何交互。
     原来是右下角蜘蛛网 + 五只飞行蝙蝠，现在换成冬青 / 六角雪花 + 边缘飘雪。 -->
<!-- z215：右下角圣诞树独立挂在 body（不放在 .xm-scene 里）。
     .xm-scene 是 z-index:3 的层叠上下文，树待在里面永远盖不过 z-index:5 的首页小卡，
     会被卡片边缘切成半截。移出来单独给 z-index:6（高于卡片、低于顶栏/侧栏 60），
     树就能完整地待在右下角；卡片右侧留白避让，不再压文字。 -->
<!-- z216：换用补了木棕色树干的素材（原图树冠直接插在雪堆里，看不出树干）。
     生成脚本 .workbuddy/make-z216-trunk.py，原图 xmas-tree-gifts.png 保留可回滚。 -->
