<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>门店筹建管理系统</title>
<link rel="stylesheet" href="css/base.css?v=20261023z20" />
<link rel="stylesheet" href="css/layout.css?v=20261023z20" />
<link rel="stylesheet" href="css/components.css?v=20261023z20" />
<link rel="stylesheet" href="css/login.css?v=20261023z20" />
</head>
<body>

<div class="app">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 7.5l1.2-4h12.6l1.2 4"/>
          <path d="M3 7.5h14V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7.5z"/>
          <path d="M7.5 17v-4.5h5V17"/>
        </svg>
      </span>
      <span class="brand-name">门店筹建管理系统</span>
      <span class="brand-slogan">让每一家门店，按时开业！</span>
    </div>

    <div class="topbar-right">
      <label class="search-box">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="9" cy="9" r="5.2"/><path d="M13 13l3.5 3.5"/>
        </svg>
        <input id="globalSearch" type="text" placeholder="搜索门店名称、任务、负责人..." autocomplete="off" />
        <div class="search-pop" id="searchPop"></div>
      </label>

      <button class="icon-btn" id="bellBtn" title="预警中心">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3.2a4.4 4.4 0 0 0-4.4 4.4c0 3.9-1.5 4.9-1.5 4.9h11.8s-1.5-1-1.5-4.9A4.4 4.4 0 0 0 10 3.2z"/>
          <path d="M8.6 15.4a1.7 1.7 0 0 0 2.8 0"/>
        </svg>
        <span class="bell-dot" id="bellDot" hidden>0</span>
      </button>

      <div class="topbar-user">
        <span class="avatar avatar-md" style="background:#3f6bf5">管</span>
      </div>
    </div>
  </header>

  <div class="shell">

    <!-- ========== 侧边栏 ========== -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="nav">
        <a class="nav-item" data-route="home">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4L10 3l7 5.4V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.4z"/><path d="M7.6 17v-4.6h4.8V17"/></svg>
          <span>首页</span>
        </a>
        <a class="nav-item" data-route="stores">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 7l1-3.4h12.8l1 3.4"/><path d="M3.2 7h13.6v9.4a1 1 0 0 1-1 1H4.2a1 1 0 0 1-1-1V7z"/><path d="M7.6 17v-4.2h4.8V17"/></svg>
          <span>门店管理</span>
        </a>
        <a class="nav-item" data-route="tasks">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="14" rx="1.6"/><path d="M7.4 7h5.2M7.4 10h5.2M7.4 13h3.4"/></svg>
          <span>任务管理</span>
        </a>
        <a class="nav-item" data-route="team">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="6.8" r="2.6"/><path d="M3.3 16.4c0-2.5 2.1-4.2 4.7-4.2s4.7 1.7 4.7 4.2"/><path d="M13.6 5.9a2 2 0 1 1 .1 4"/><path d="M14.4 12.4c1.5.4 2.4 1.7 2.4 3.3"/></svg>
          <span>团队工作台</span>
        </a>
        <a class="nav-item" data-route="alerts">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2a4.4 4.4 0 0 0-4.4 4.4c0 3.9-1.5 4.9-1.5 4.9h11.8s-1.5-1-1.5-4.9A4.4 4.4 0 0 0 10 3.2z"/><path d="M8.6 15.4a1.7 1.7 0 0 0 2.8 0"/></svg>
          <span>预警中心</span>
          <span class="nav-badge" id="navAlertBadge" hidden>0</span>
        </a>
        <a class="nav-item" data-route="reports">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 16.4h13.2"/><path d="M6 16V9.4M10 16V4.6M14 16v-4.2"/></svg>
          <span>数据报表</span>
        </a>
        <a class="nav-item" data-route="settings">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.6v1.9M10 15.5v1.9M2.6 10h1.9M15.5 10h1.9M4.8 4.8l1.3 1.3M13.9 13.9l1.3 1.3M15.2 4.8l-1.3 1.3M6.1 13.9l-1.3 1.3"/></svg>
          <span>系统设置</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="storage-card">
          <div class="storage-head"><span>本地数据</span><b id="storageSize">—</b></div>
          <div class="storage-track"><i id="storageBar" style="width:0%"></i></div>
          <p>数据保存在本机浏览器</p>
        </div>
      </div>
    </aside>

    <!-- ========== 内容区 ========== -->
    <main class="content" id="view"></main>

  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="js/vendor/cloud-sdk.js?v=20261023z20"></script>
<script src="js/utils.js?v=20261023z20"></script>
<script src="js/constants.js?v=20261023z20"></script>
<script src="js/cloud.js?v=20261023z20"></script>
<script src="js/seed.js?v=20261023z20"></script>
<script src="js/store.js?v=20261023z20"></script>
<script src="js/charts.js?v=20261023z20"></script>
<script src="js/ui.js?v=20261023z20"></script>
<script src="js/login.js?v=20261023z20"></script>
<script src="js/page-home.js?v=20261023z20"></script>
<script src="js/page-stores.js?v=20261023z20"></script>
<script src="js/page-tasks.js?v=20261023z20"></script>
<script src="js/page-team.js?v=20261023z20"></script>
<script src="js/page-alerts.js?v=20261023z20"></script>
<script src="js/page-reports.js?v=20261023z20"></script>
<script src="js/page-settings.js?v=20261023z20"></script>
<script src="js/app.js?v=20261023z20"></script>
</body>
</html>
