<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>门店筹建管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4' fill='%232f56f0'/%3E%3Cpath d='M4 8l1-3h10l1 3v6.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/base.css?v=20261029z155" />
<link rel="stylesheet" href="css/layout.css?v=20261029z155" />
<link rel="stylesheet" href="css/components.css?v=20261029z155" />
<link rel="stylesheet" href="css/login.css?v=20261029z155" />
<link rel="stylesheet" href="css/theme.css?v=20261029z155" />
</head>
<body class="booting">

<div class="app">

  <!-- ========== 顶栏 ========== -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 7.5l1.2-4h12.6l1.2 4"/>
          <path d="M3 7.5h14V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7.5z"/>
          <path d="M7.5 17v-4.5h5V17"/>
        </svg>
      </span>
      <span class="brand-name">门店筹建管理系统</span>
      <span class="brand-slogan">让每一家门店，按时开业！</span>
    </div>

    <div class="topbar-right">
      <label class="search-box">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="9" cy="9" r="5.2"/><path d="M13 13l3.5 3.5"/>
        </svg>
        <input id="globalSearch" type="text" placeholder="搜索门店名称、任务、负责人..." autocomplete="off" />
        <div class="search-pop" id="searchPop"></div>
      </label>

      <button class="icon-btn" id="bellBtn" title="预警中心">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3.2a4.4 4.4 0 0 0-4.4 4.4c0 3.9-1.5 4.9-1.5 4.9h11.8s-1.5-1-1.5-4.9A4.4 4.4 0 0 0 10 3.2z"/>
          <path d="M8.6 15.4a1.7 1.7 0 0 0 2.8 0"/>
        </svg>
        <span class="bell-dot" id="bellDot" hidden>0</span>
      </button>

      <button class="icon-btn" id="outboxBtn" title="待发送数据" hidden>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6.2h14M3 6.2v8.6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6.2a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/>
          <path d="M3 6.2 10 11l7-4.8"/>
        </svg>
        <span class="bell-dot" id="outboxDot">0</span>
      </button>

      <div class="topbar-user" title="当前登录人 · 点击去设置">
        <span class="avatar avatar-md" style="background:#3f6bf5">我</span>
        <span class="topbar-user-name" id="topbarUserName"></span>
      </div>
    </div>
  </header>

  <div class="shell">

    <!-- ========== 侧边栏 ========== -->
    <aside class="sidebar" id="sidebar">
      <nav class="nav" id="nav">
        <a class="nav-item" data-route="home" data-tip="首页">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4L10 3l7 5.4V16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.4z"/><path d="M7.6 17v-4.6h4.8V17"/></svg>
          <span>首页</span>
        </a>
        <a class="nav-item" data-route="stores" data-tip="门店管理">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 7l1-3.4h12.8l1 3.4"/><path d="M3.2 7h13.6v9.4a1 1 0 0 1-1 1H4.2a1 1 0 0 1-1-1V7z"/><path d="M7.6 17v-4.2h4.8V17"/></svg>
          <span>门店管理</span>
        </a>
        <a class="nav-item" data-route="tasks" data-tip="任务管理">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="14" rx="1.6"/><path d="M7.4 7h5.2M7.4 10h5.2M7.4 13h3.4"/></svg>
          <span>任务管理</span>
        </a>
        <a class="nav-item" data-route="ship" data-tip="发货看板">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 6.2h7.6v7.6H2.6z"/><path d="M10.2 8.9h3.2l3 3v1.9h-6.2"/><circle cx="5.6" cy="15.4" r="1.5"/><circle cx="13.6" cy="15.4" r="1.5"/></svg>
          <span>发货看板</span>
        </a>
        <a class="nav-item" data-route="team" data-tip="团队工作台">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="6.8" r="2.6"/><path d="M3.3 16.4c0-2.5 2.1-4.2 4.7-4.2s4.7 1.7 4.7 4.2"/><path d="M13.6 5.9a2 2 0 1 1 .1 4"/><path d="M14.4 12.4c1.5.4 2.4 1.7 2.4 3.3"/></svg>
          <span>团队工作台</span>
        </a>
        <a class="nav-item" data-route="alerts" data-tip="预警中心">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2a4.4 4.4 0 0 0-4.4 4.4c0 3.9-1.5 4.9-1.5 4.9h11.8s-1.5-1-1.5-4.9A4.4 4.4 0 0 0 10 3.2z"/><path d="M8.6 15.4a1.7 1.7 0 0 0 2.8 0"/></svg>
          <span>预警中心</span>
          <span class="nav-badge" id="navAlertBadge" hidden>0</span>
        </a>
        <a class="nav-item" data-route="reports" data-tip="数据报表">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 16.4h13.2"/><path d="M6 16V9.4M10 16V4.6M14 16v-4.2"/></svg>
          <span>数据报表</span>
        </a>
        <a class="nav-item" data-route="settings" data-tip="系统设置">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.6v1.9M10 15.5v1.9M2.6 10h1.9M15.5 10h1.9M4.8 4.8l1.3 1.3M13.9 13.9l1.3 1.3M15.2 4.8l-1.3 1.3M6.1 13.9l-1.3 1.3"/></svg>
          <span>系统设置</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="storage-card">
          <div class="storage-head"><span>本机缓存</span><b id="storageSize">—</b></div>
          <div class="storage-track"><i id="storageBar" style="width:0%"></i></div>
          <p>数据在云端，本机只留缓存</p>
        </div>
      </div>
    </aside>

    <!-- ========== 内容区 ========== -->
    <main class="content" id="view"></main>

  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<!-- 万圣节全局装饰：固定定位 + pointer-events:none，不挡任何交互（仅氛围，可随时整体移除） -->

  <svg class="hw-web" viewBox="0 0 100 100" fill="none" stroke="#8a7bc0" stroke-width="1.4" aria-hidden="true">
    <path d="M100 0 L0 0"/><path d="M100 0 L15 45"/><path d="M100 0 L45 85"/><path d="M100 0 L100 100"/>
    <path d="M82 0 Q79 16 100 19"/><path d="M62 0 Q53 36 100 40"/><path d="M42 0 Q26 56 100 61"/><path d="M22 0 Q2 76 100 80"/>
  </svg>
  <svg class="hw-bat-fly" viewBox="0 0 44 26" aria-hidden="true">
    <path d="M22 12 Q14 4 5 5 Q1 6 3 10 Q6 13 12 12 Q17 11 22 12 Z" fill="#4a3e6b"/>
    <path d="M22 12 Q30 4 39 5 Q43 6 41 10 Q38 13 32 12 Q27 11 22 12 Z" fill="#4a3e6b"/>
    <ellipse cx="22" cy="13" rx="3" ry="4" fill="#4a3e6b"/>
    <circle cx="21" cy="12" r="1" fill="#f6a11c"/><circle cx="23" cy="12" r="1" fill="#f6a11c"/>
  </svg>
  <svg class="hw-pumpkin-fly" viewBox="0 0 40 40" aria-hidden="true">
    <path d="M19 2 Q20 0 21 2 L21 5 L19 5 Z" fill="#7a4a12"/>
    <ellipse cx="20" cy="21" rx="16" ry="15" fill="#f6a11c"/>
    <ellipse cx="12" cy="21" rx="6" ry="14" fill="#e8892a"/>
    <ellipse cx="28" cy="21" rx="6" ry="14" fill="#e8892a"/>
    <path d="M12 15 L17 19 L13 22 Z" fill="#3a2f4d"/><path d="M28 15 L23 19 L27 22 Z" fill="#3a2f4d"/>
    <path d="M12 27 Q16 24 20 27 Q24 24 28 27 L28 32 L12 32 Z" fill="#3a2f4d"/>
  </svg>
</div>

<script src="js/vendor/cloudbase-sdk.js?v=20261029z155"></script>
<script src="js/utils.js?v=20261029z155"></script>
<script src="js/constants.js?v=20261029z155"></script>
<script src="js/cloud.js?v=20261029z155"></script>
<script src="js/seed.js?v=20261029z155"></script>
<script src="js/store.js?v=20261029z155"></script>
<script src="js/charts.js?v=20261029z155"></script>
<script src="js/ui.js?v=20261029z155"></script>
<script src="js/login.js?v=20261029z155"></script>
<script src="js/page-home.js?v=20261029z155"></script>
<script src="js/page-stores.js?v=20261029z155"></script>
<script src="js/page-ship.js?v=20261029z155"></script>
<script src="js/page-tasks.js?v=20261029z155"></script>
<script src="js/page-team.js?v=20261029z155"></script>
<script src="js/page-alerts.js?v=20261029z155"></script>
<script src="js/page-reports.js?v=20261029z155"></script>
<script src="js/page-settings.js?v=20261029z155"></script>
<script src="js/app.js?v=20261029z155"></script>
</body>
</html>
